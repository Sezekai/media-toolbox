name: Build and release

# Every push to main: install, test, fetch FFmpeg, build the .exe, run its self-test, then publish a numbered
# GitHub Release (v + version.py). No Actions artifacts are uploaded (they count against storage).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          $v = (Select-String -Path version.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          $exists = git ls-remote --tags origin "refs/tags/v$v"
          "exists=$([bool]$exists)" >> $env:GITHUB_OUTPUT

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          Copy-Item (Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName ffmpeg.exe
          Copy-Item (Get-ChildItem ffmpeg_tmp -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName ffprobe.exe

      - name: Build the .exe
        run: >
          pyinstaller --noconsole --onefile --name MediaToolbox --add-data "fonts;fonts"
          --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;."
          main.py

      - name: Self-test the packaged .exe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist\MediaToolbox.exe -ArgumentList "--selftest", "selftest" -Wait -PassThru
          Get-Content selftest\selftest.txt
          if ($p.ExitCode -ne 0) { throw "The self-test failed (exit code $($p.ExitCode))." }

      - name: Write release notes
        shell: pwsh
        run: |
          $log = git log -1 --pretty=%B
          @"
          Media Toolbox ${{ steps.version.outputs.version }}

          Download MediaToolbox.exe below and run it. It's one portable program: keep it in a folder of its own
          (for example D:\Media Toolbox\App\MediaToolbox.exe) and its Models, Fingerprints and Cache folders are
          made beside that folder. Settings and logs live in %LOCALAPPDATA%\Media Toolbox.

          What changed:
          $log
          "@ | Out-File notes.md -Encoding utf8

      - name: Publish the release
        if: steps.version.outputs.exists == 'False'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Media Toolbox ${{ steps.version.outputs.version }}
          body_path: notes.md
          target_commitish: ${{ github.sha }}
          files: dist/MediaToolbox.exe

      - name: Already released
        if: steps.version.outputs.exists == 'True'
        run: echo "v${{ steps.version.outputs.version }} already exists. Raise the number in version.py to publish a new release."
